# WM-811K 本機開發環境
#
# 分工：
#   - 本機容器（此檔）：資料探查 / EDA / 管線 pytest / CPU 冒煙訓練
#   - Google Colab：正式 GPU 訓練（容器不開 GPU —— WSL2 GPU 穿透需額外設定，暫不引入）
#
# 用法（在 repo 根執行，PowerShell）：
#   docker compose build                        # 首次建置（約 5–10 分鐘）
#   docker compose run --rm app python scripts/inspect_data.py
#   docker compose run --rm app python -m pytest
#   docker compose run --rm -p 8888:8888 app jupyter lab --ip=0.0.0.0 --allow-root
#
# 注意：docker compose run 每次建立一次性容器（無狀態）；
#       程式碼與資料靠 bind mount（.:/workspace）共享，改檔不需重建 image
services:
  app:
    build: .
    image: wm811k:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
